<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3105 Remote · GitHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#0b0d12; --surface:#12151c; --surface2:#1a1e28; --border:#2a3040;
      --text:#e8eaef; --muted:#8b93a7; --accent:#e6753a; --ok:#3dd68c;
      --warn:#f5a623; --danger:#ff5c5c; --radius:14px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
      background-image:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(230,117,58,.12),transparent)}
    .wrap{max-width:960px;margin:0 auto;padding:28px 18px 80px}
    .logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
    .logo-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#c45a2a);
      display:grid;place-items:center;font-weight:700;box-shadow:0 8px 24px rgba(230,117,58,.35)}
    .logo h1{font-size:1.2rem}.logo span{color:var(--muted);font-size:.85rem;display:block}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px}
    .card h2{font-size:.95rem;margin-bottom:14px}
    label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:500}
    input,select,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
      background:var(--surface2);color:var(--text);font-size:.95rem;outline:none}
    input:focus,select:focus{border-color:var(--accent)}
    .field{margin-bottom:12px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:640px){.row{grid-template-columns:1fr}}
    .file-box{border:1.5px dashed var(--border);border-radius:10px;padding:16px;text-align:center;
      color:var(--muted);position:relative;cursor:pointer}
    .file-box input{position:absolute;inset:0;opacity:0;cursor:pointer}
    .file-box strong{color:var(--text);display:block}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:10px;border:none;
      font-weight:600;font-size:.9rem;cursor:pointer}
    .btn-primary{background:linear-gradient(135deg,var(--accent),#c45a2a);color:#fff}
    .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
    .btn-danger{background:rgba(255,92,92,.15);color:var(--danger);border:1px solid rgba(255,92,92,.3)}
    .btn-warn{background:rgba(245,166,35,.12);color:var(--warn);border:1px solid rgba(245,166,35,.3)}
    .btn-sm{padding:8px 12px;font-size:.8rem}
    .badge{font-size:.7rem;font-weight:600;padding:6px 10px;border-radius:999px;
      background:rgba(61,214,140,.12);color:var(--ok);border:1px solid rgba(61,214,140,.25)}
    .patch{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;
      background:var(--surface2);border:1px solid var(--border);margin-bottom:10px}
    .patch img,.ph{width:48px;height:48px;border-radius:12px;object-fit:cover;border:1px solid var(--border);flex-shrink:0}
    .ph{display:grid;place-items:center;background:var(--surface);color:var(--muted)}
    .meta{flex:1;min-width:0}
    .meta h3{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta p{font-size:.78rem;color:var(--muted);margin-top:3px}
    .tag{font-size:.68rem;font-weight:600;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.05);color:var(--muted);margin-right:4px}
    .tag.maint{background:rgba(245,166,35,.15);color:var(--warn)}
    .toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border);
      padding:12px 18px;border-radius:10px;opacity:0;transform:translateY(12px);transition:.25s;z-index:50}
    .toast.show{opacity:1;transform:none}
    .hidden{display:none!important}
    .hint{font-size:.8rem;color:var(--muted);line-height:1.5;margin-top:8px}
    a{color:var(--accent)}
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-mark">31</div>
    <div>
      <h1>3105 Remote · GitHub</h1>
      <span>Sempre online · sem túnel</span>
    </div>
    <span class="badge" style="margin-left:auto">GitHub</span>
  </div>
  <div class="card" id="setupCard">
    <h2>🔑 Configuração (uma vez)</h2>
    <div class="field">
      <label>GitHub Personal Access Token (repo scope)</label>
      <input type="password" id="ghToken" placeholder="ghp_..." />
    </div>
    <div class="row">
      <div class="field">
        <label>Owner</label>
        <input type="text" id="ghOwner" value="bts2019amo-ctrl" />
      </div>
      <div class="field">
        <label>Repo</label>
        <input type="text" id="ghRepo" value="3105-remote-patches" />
      </div>
    </div>
    <button class="btn btn-primary" onclick="saveSetup()">Salvar e entrar</button>
    <p class="hint">
      Crie o token em
      <a href="https://github.com/settings/tokens/new?scopes=repo&description=3105-remote" target="_blank">github.com/settings/tokens</a>
      com permissão <b>repo</b>. O token fica só no seu navegador.
    </p>
  </div>
  <div id="dash" class="hidden">
    <div class="card">
      <h2>＋ Publicar patch</h2>
      <div class="field">
        <label>Nome (aparece no app)</label>
        <input type="text" id="newName" placeholder="Ex: HS ALTO + ANTENA" />
      </div>
      <div class="row">
        <div class="field">
          <label>Categoria</label>
          <select id="newCategory">
            <option value="normal">Normal</option>
            <option value="max">Max</option>
          </select>
        </div>
        <div class="field">
          <label>Feature</label>
          <select id="newFeature">
            <option value="cache">Cache</option>
            <option value="avatar">Avatar</option>
            <option value="hologram">Hologram</option>
            <option value="external">External</option>
            <option value="skin">Skin</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Changelog</label>
        <input type="text" id="newChangelog" placeholder="Opcional" />
      </div>
      <div class="row">
        <div class="field">
          <label>Arquivo .3105</label>
          <div class="file-box">
            <strong id="fileLabel">Selecionar .3105</strong>
            <span>arquivo do patch</span>
            <input type="file" id="newFile" accept=".3105,.3105pass" onchange="document.getElementById('fileLabel').textContent=this.files[0]?.name||'Selecionar .3105'" />
          </div>
        </div>
        <div class="field">
          <label>Ícone</label>
          <div class="file-box">
            <strong id="iconLabel">Selecionar imagem</strong>
            <span>PNG / JPG</span>
            <input type="file" id="newIcon" accept="image/*" onchange="document.getElementById('iconLabel').textContent=this.files[0]?.name||'Selecionar imagem'" />
          </div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="publish()" id="pubBtn">Publicar</button>
    </div>
    <div class="card">
      <h2>📦 Patches <span id="count" style="color:var(--muted)"></span></h2>
      <div id="list"><div style="color:var(--muted);text-align:center;padding:24px">Carregando...</div></div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="logout()">Sair / trocar token</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
